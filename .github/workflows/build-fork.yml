name: Build fork APK

on:
  workflow_dispatch:
  push:
    branches: [sync]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # 仓库里自带一份占位配置，所以没有 secret 也能构建；
      # 想要真实的崩溃统计时，加一个 GOOGLE_SERVICES_JSON secret 就会覆盖它。
      - name: Prepare google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "使用 secret 里的 Firebase 配置"
          else
            echo "使用仓库内的占位配置"
          fi

      # debug 版包名带 .debug 后缀，可以和官方版共存，也不需要自己的签名
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleGithubDebug --no-daemon 2>&1 | tee gradle.log

      # 失败时把日志推到 ci-logs 分支，方便排查（不触发新的构建）
      - name: Keep failure log
        if: failure()
        run: |
          tail -n 600 gradle.log > build-error.log || true
          git config user.name "rikka-ci"
          git config user.email "ci@local"
          git add -f build-error.log
          git commit -m "ci: build error log"
          git push -f origin HEAD:ci-logs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-fork-debug
          path: app/build/outputs/apk/github/debug/*.apk
